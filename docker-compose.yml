services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mpn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mpn_user
      POSTGRES_PASSWORD: mpn_pass
      POSTGRES_DB: mpn_db
    ports:
      - "5432:5432"
    volumes:
      - mpn_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpn_user -d mpn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mpn_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mpn_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mpn_pg_data:
